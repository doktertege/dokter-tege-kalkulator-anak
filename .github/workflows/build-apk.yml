name: Build MEDORA Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "feature/icd10-database-expansion" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MEDORA_KEYSTORE_PASSWORD: ${{ secrets.MEDORA_KEYSTORE_PASSWORD }}
      MEDORA_KEY_ALIAS: ${{ secrets.MEDORA_KEY_ALIAS }}
      MEDORA_KEY_PASSWORD: ${{ secrets.MEDORA_KEY_PASSWORD }}
      MEDORA_SIGNING_CONFIGURED: ${{ secrets.MEDORA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate MEDORA HTML and JavaScript
        run: python3 scripts/validate-medora.py
      - name: Run pediatric dose calculation tests
        run: node --test tests/*.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare persistent MEDORA signing key
        if: ${{ env.MEDORA_SIGNING_CONFIGURED == 'true' }}
        env:
          MEDORA_KEYSTORE_BASE64: ${{ secrets.MEDORA_KEYSTORE_BASE64 }}
        run: |
          echo "$MEDORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/medora-release.jks"
          echo "MEDORA_KEYSTORE_FILE=$RUNNER_TEMP/medora-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ secrets.MEDORA_KEYSTORE_BASE64 != '' }}
        run: gradle --no-daemon assembleRelease
      - name: Build debug APK (temporary until signing key is configured)
        if: ${{ env.MEDORA_SIGNING_CONFIGURED != 'true' }}
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MEDORA-Android-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
